<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Breach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        canvas {
            display: block;
            width: 100%;
            height: 450px;
            cursor: crosshair;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-top: 5vh;
        }

        .game-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .glitch-link {
            position: relative;
            display: inline-block;
            transition: color 0.3s;
        }

        .glitch-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: #3b82f6;
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .glitch-link:hover::after {
            transform: scaleX(1);
        }

        #score-display {
            position: absolute;
            top: -30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: #3b82f6;
            font-weight: 800;
        }

        .game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
    </style>
</head>

<body>

    <div class="noise"></div>

    <div class="content">
        <p class="text-blue-500 font-bold tracking-[0.4em] text-[10px] mb-4 uppercase">Error 404</p>
        <h1 class="text-4xl font-extrabold mb-2 tracking-tighter uppercase">Space Defense</h1>
        <p class="text-gray-500 text-xs mb-10 opacity-60 italic">Hancurkan barisan error untuk memulihkan navigasi...
        </p>

        <div class="game-container">
            <div id="score-display">
                <span>SECTOR_SECURED: <span id="score">0</span></span>
                <span>STATUS: <span id="status">ACTIVE</span></span>
            </div>
            <div class="game-over-overlay" id="game-over">
                <p class="text-white font-black text-2xl mb-2" id="result-heading">MISSION FAILED</p>
                <p class="text-gray-500 text-[10px] mb-6 tracking-widest uppercase" id="result-desc">SISTEM TERLALU
                    BANYAK ERROR.</p>
                <button onclick="resetGame()"
                    class="bg-white text-black px-8 py-3 rounded-full text-[10px] font-bold tracking-widest uppercase hover:scale-105 transition-transform">Reboot
                    System</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="mt-8 flex justify-center gap-12">
            <a href="index.html" class="glitch-link text-[10px] font-bold tracking-[0.2em] uppercase py-2">
                Back to Dashboard
            </a>
            <a href="#" onclick="resetGame()"
                class="glitch-link text-[10px] font-bold tracking-[0.2em] uppercase py-2 opacity-50">
                Reset Game
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const statusEl = document.getElementById('status');
        const gameOverEl = document.getElementById('game-over');

        let animationId;
        let gameActive = true;
        let score = 0;

        const player = {
            x: 0,
            y: 0,
            w: 40,
            h: 20,
            speed: 8
        };

        let bullets = [];
        let invaders = [];
        const invaderRows = 4;
        const invaderCols = 8;
        let invaderDirection = 1;
        let invaderSpeed = 0.5; // Kecepatan awal diperlambat
        let lastShootTime = 0;
        const shootDelay = 250; // Jeda antar tembakan (ms)

        function initInvaders() {
            invaders = [];
            const textArr = ['4', '0', '4', 'X'];
            for (let r = 0; r < invaderRows; r++) {
                for (let c = 0; c < invaderCols; c++) {
                    invaders.push({
                        x: c * 60 + 100,
                        y: r * 40 + 50,
                        w: 20,
                        h: 20,
                        char: textArr[r % 3],
                        alive: true
                    });
                }
            }
        }

        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 450;
            player.x = canvas.width / 2 - player.w / 2;
            player.y = canvas.height - 40;
            initInvaders();
        }

        function drawPlayer() {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y);
            ctx.lineTo(player.x, player.y + player.h);
            ctx.lineTo(player.x + player.w, player.y + player.h);
            ctx.fill();

            ctx.shadowBlur = 10;
            ctx.shadowColor = '#3b82f6';
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(player.x + player.w / 2 - 2, player.y + 5, 4, 10);
            ctx.shadowBlur = 0;
        }

        function drawInvaders() {
            let edgeReached = false;
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'center';

            invaders.forEach(inv => {
                if (!inv.alive) return;

                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ff0055';
                ctx.fillText(inv.char, inv.x, inv.y);
                ctx.shadowBlur = 0;

                inv.x += invaderDirection * invaderSpeed;

                if (inv.x + 25 > canvas.width || inv.x < 25) {
                    edgeReached = true;
                }

                // Game Over jika musuh sampai ke bawah
                if (inv.y > player.y) endGame(false);
            });

            if (edgeReached) {
                invaderDirection *= -1;
                invaders.forEach(inv => inv.y += 15); // Turun sedikit demi sedikit
                invaderSpeed += 0.05; // Akselerasi diperhalus
            }
        }

        function drawBullets() {
            bullets.forEach((b, index) => {
                b.y -= 6; // Kecepatan peluru disesuaikan
                ctx.fillStyle = '#3b82f6';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#3b82f6';
                ctx.fillRect(b.x, b.y, 2, 10);
                ctx.shadowBlur = 0;

                invaders.forEach(inv => {
                    if (inv.alive && b.x > inv.x - 12 && b.x < inv.x + 12 && b.y > inv.y - 18 && b.y < inv.y) {
                        inv.alive = false;
                        bullets.splice(index, 1);
                        score += 10;
                        scoreEl.innerText = score;
                        checkWin();
                    }
                });

                if (b.y < 0) bullets.splice(index, 1);
            });
        }

        function update() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBullets();
            drawInvaders();
            drawPlayer();

            animationId = requestAnimationFrame(update);
        }

        function shoot() {
            const now = Date.now();
            if (gameActive && now - lastShootTime > shootDelay) {
                bullets.push({ x: player.x + player.w / 2, y: player.y });
                lastShootTime = now;
            }
        }

        function checkWin() {
            if (invaders.every(inv => !inv.alive)) {
                endGame(true);
            }
        }

        function endGame(win) {
            gameActive = false;
            cancelAnimationFrame(animationId);
            gameOverEl.style.display = 'flex';
            if (win) {
                document.getElementById('result-heading').innerText = "SYSTEM RESTORED";
                document.getElementById('result-desc').innerText = "SEMUA ERROR TELAH DIHANCURKAN.";
                statusEl.innerText = "CLEAN";
            } else {
                document.getElementById('result-heading').innerText = "SYSTEM CRASHED";
                document.getElementById('result-desc').innerText = "ERROR BERHASIL MENEMBUS PERTAHANAN.";
                statusEl.innerText = "INFECTED";
            }
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = 0;
            gameActive = true;
            invaderSpeed = 0.5;
            invaderDirection = 1;
            bullets = [];
            gameOverEl.style.display = 'none';
            statusEl.innerText = "ACTIVE";
            resize();
            update();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') player.x = Math.max(0, player.x - 25);
            if (e.key === 'ArrowRight') player.x = Math.min(canvas.width - player.w, player.x + 25);
            if (e.key === ' ' || e.key === 'ArrowUp') shoot();
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.w / 2;
        });

        canvas.addEventListener('mousedown', shoot);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            player.x = e.touches[0].clientX - rect.left - player.w / 2;
            shoot();
        }, { passive: false });

        window.addEventListener('resize', resize);

        resize();
        update();
    </script>
</body>

</html>
