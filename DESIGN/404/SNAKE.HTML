<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Crawler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        canvas {
            display: block;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0 auto;
            max-width: 100%;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding-top: 5vh;
        }

        #score-display {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: #3b82f6;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .game-over-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>

<body>

    <div class="noise"></div>

    <div class="content">
        <p class="text-blue-500 font-bold tracking-[0.4em] text-[10px] mb-4 uppercase">Error 404</p>
        <h1 class="text-3xl font-extrabold mb-2 tracking-tighter uppercase">System Crawler</h1>
        <p class="text-gray-500 text-xs mb-8 opacity-60 italic">Kumpulkan fragmen data untuk memperbaiki koneksi...</p>

        <div class="relative inline-block">
            <div id="score-display">DATA_COLLECTED: <span id="score">0</span></div>
            <div class="game-over-overlay" id="game-over">
                <p class="text-white font-black text-2xl mb-2">SYSTEM HALT</p>
                <p class="text-gray-500 text-[10px] mb-6 tracking-widest uppercase">ULAR MENABRAK DINDING SISTEM.</p>
                <button onclick="resetGame()"
                    class="bg-white text-black px-8 py-3 rounded-full text-[10px] font-bold tracking-widest uppercase hover:scale-105 transition-transform">Restart
                    Crawler</button>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div class="controls-hint">Gunakan Panah Keyboard atau Swipe untuk Belok</div>
        </div>

        <div class="mt-8 flex justify-center gap-12">
            <a href="index.html" class="text-[10px] font-bold tracking-[0.2em] uppercase py-2 border-b border-blue-500">
                Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('game-over');

        const gridSize = 20;
        let tileCount;
        let score = 0;

        let dx = 0;
        let dy = 0;
        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let gameActive = true;
        let speed = 100;

        function resize() {
            const size = Math.min(window.innerWidth - 40, 400);
            canvas.width = size;
            canvas.height = size;
            tileCount = canvas.width / gridSize;
            resetGame();
        }

        function resetGame() {
            snake = [{ x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }];
            generateFood();
            dx = 0;
            dy = 0;
            score = 0;
            scoreEl.innerText = score;
            gameActive = true;
            gameOverEl.style.display = 'none';
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Pastikan makanan tidak muncul di badan ular
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function draw() {
            if (!gameActive) return;

            // Pindahkan ular
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Jika sedang bergerak
            if (dx !== 0 || dy !== 0) {
                // Tabrak dinding
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    return endGame();
                }

                // Tabrak badan sendiri
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) return endGame();
                }

                snake.unshift(head);

                // Makan makanan
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreEl.innerText = score;
                    generateFood();
                } else {
                    snake.pop();
                }
            }

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid halus
            ctx.strokeStyle = "rgba(255,255,255,0.02)";
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Makanan (Neon Red)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff0055";
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);

            // Ular (Neon Blue)
            ctx.shadowColor = "#3b82f6";
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#fff" : "#3b82f6";
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
            ctx.shadowBlur = 0;

            setTimeout(() => {
                requestAnimationFrame(draw);
            }, speed);
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
        }

        // Kontrol
        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp': if (dy !== 1) { dx = 0; dy = -1; } break;
                case 'ArrowDown': if (dy !== -1) { dx = 0; dy = 1; } break;
                case 'ArrowLeft': if (dx !== 1) { dx = -1; dy = 0; } break;
                case 'ArrowRight': if (dx !== -1) { dx = 1; dy = 0; } break;
            }
        });

        // Touch swipe simple
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, false);

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const touchEndX = e.touches[0].clientX;
            const touchEndY = e.touches[0].clientY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx !== -1) { dx = 1; dy = 0; }
                else if (diffX < 0 && dx !== 1) { dx = -1; dy = 0; }
            } else {
                if (diffY > 0 && dy !== -1) { dx = 0; dy = 1; }
                else if (diffY < 0 && dy !== 1) { dx = 0; dy = -1; }
            }
        }, { passive: false });

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>

</html>
